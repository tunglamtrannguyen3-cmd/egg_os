name: CI & Build ISO

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust Toolchain & Target
      run: |
        rustup toolchain install nightly --profile minimal --component rust-src
        rustup target add x86_64-unknown-uefi
        rustup target add x86_64-unknown-none

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xorriso mtools dosfstools

    - name: Build Bootloader (UEFI)
      run: cargo build --release --package bootloader --target x86_64-unknown-uefi

    - name: Build Kernels (Bare-Metal)
      run: |
        cargo build --release --package host_kernel --target x86_64-unknown-none
        cargo build --package security_kernel --target x86_64-unknown-none || true

    - name: Create FAT Partition Image for UEFI
      run: |
        # 1. Create a 64MB FAT image file
        dd if=/dev/zero of=efiboot.img bs=1M count=64
        mkfs.vfat -F 32 efiboot.img

        # 2. Create the directory layout inside the FAT image using mtools
        mmd -i efiboot.img ::/EFI
        mmd -i efiboot.img ::/EFI/BOOT

        # 3. Copy binaries into the FAT image
        mcopy -i efiboot.img target/x86_64-unknown-uefi/release/bootloader.efi ::/EFI/BOOT/BOOTX64.EFI
        mcopy -i efiboot.img target/x86_64-unknown-none/release/host_kernel ::/host_kernel

    - name: Generate Bootable UEFI ISO
      run: |
        mkdir -p iso_root
        cp efiboot.img iso_root/

        # Create hybrid ISO with UEFI El Torito boot record
        xorriso -as mkisofs \
          -e efiboot.img \
          -no-emul-boot \
          -isohybrid-gpt-basdat \
          -o egg_os.iso iso_root

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: egg_os-iso
        path: egg_os.iso
        retention-days: 7
