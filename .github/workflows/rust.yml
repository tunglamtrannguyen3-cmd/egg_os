name: Build EggOS ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools

      - name: Setup Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-none

      - name: Build Kernels (Debug)
        run: |
          cargo build --manifest-path host_kernel/Cargo.toml
          cargo build --manifest-path security_kernel/Cargo.toml

      - name: Assemble ISO
        run: |
          mkdir -p iso_root/boot/limine iso_root/limine

          # Copy binaries and config
          cp limine.conf iso_root/
          cp iso_root/limine.conf iso_root/boot/limine.conf
          cp target/x86_64-unknown-none/debug/host_kernel iso_root/host_kernel.elf
          cp target/x86_64-unknown-none/debug/security_kernel iso_root/security_kernel.elf

          # Fetch Limine binaries & build host tools
          git clone https://github.com/limine-bootloader/limine.git --branch=v7.x-binary --depth=1
          make -C limine

          # Stage Limine boot files
          cp limine/limine-bios-cd.bin limine/limine-uefi-cd.bin limine/limine-bios.sys iso_root/boot/limine/

          # Package ISO image
          xorriso -as mkisofs -R -J \
            -b boot/limine/limine-bios-cd.bin \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            --efi-boot boot/limine-uefi-cd.bin \
            -efi-boot-part --efi-boot-image --protective-msdos-label \
            iso_root -o egg_os.iso

          # Install BIOS boot stage
          ./limine/limine bios-install egg_os.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: egg_os-iso
          path: egg_os.isoname: EggOS CI & ISO Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Kernels and Package ISO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools

      - name: Setup Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Build Host Kernel
        run: cargo build --manifest-path host_kernel/Cargo.toml --target x86_64-unknown-none

      - name: Build Security Kernel
        run: cargo build --manifest-path security_kernel/Cargo.toml --target x86_64-unknown-none

      - name: Assemble ISO Image
        run: |
          mkdir -p iso_root/boot iso_root/limine
          cp target/x86_64-unknown-none/debug/host_kernel iso_root/boot/kernel.elf

          # Write limine.conf cleanly using printf (prevents YAML indentation errors)
          printf "timeout: 3\n\n/EggOS\n    protocol: limine\n    kernel_path: boot():/boot/kernel.elf\n" > iso_root/boot/limine.conf

          # Mirror config to root and limine directories
          cp iso_root/boot/limine.conf iso_root/limine.conf
          cp iso_root/boot/limine.conf iso_root/limine/limine.conf

          # Clone and compile Limine v7 host tools
          git clone https://github.com/limine-bootloader/limine.git --branch=v7.x-binary --depth=1
          make -C limine

          # Copy Limine stage files to ISO root
          cp -v limine/limine-bios.sys limine/limine-bios-cd.bin limine/limine-uefi-cd.bin iso_root/
          cp -v limine/limine-bios.sys limine/limine-bios-cd.bin limine/limine-uefi-cd.bin iso_root/boot/

          # Generate hybrid bootable ISO
          xorriso -as mkisofs -b limine-bios-cd.bin \
                  -no-emul-boot -boot-load-size 4 -boot-info-table \
                  --efi-boot limine-uefi-cd.bin \
                  -efi-boot-part --efi-boot-image --protective-msdos-label \
                  iso_root -o egg_os.iso

          # Install BIOS bootloader record
          ./limine/limine bios-install egg_os.iso

      - name: Upload EggOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: egg_os-bootable-iso
          path: egg_os.iso
