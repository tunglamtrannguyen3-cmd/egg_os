name: EggOS CI

on:
  push:
    branches: [ "master" ]name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust Toolchain
      run: |
        rustup toolchain install nightly --profile minimal --component rust-src
        rustup target add x86_64-unknown-none

    - name: Check Workspace
      run: cargo check --workspace

    - name: Build Workspace
      run: cargo build --workspace
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y xorriso mtools

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-none

      - name: Build Project
        run: cargo build --target x86_64-unknown-none

      - name: Prepare Limine
        run: |
          git clone https://github.com/limine-bootloader/limine.git --branch=v7.x-binary --depth=1
          make -C limine
          echo "=== Limine files ==="
          ls -la limine/ | grep -E "EFI|bin|sys"

      - name: Assemble ISO (UEFI)
        run: |
          mkdir -p iso_root/boot iso_root/EFI/BOOT
          
          # Copy kernel binaries from debug output
          find target/x86_64-unknown-none/debug -type f ! -name "*.d" ! -name "*.rlib" ! -name "deps" | head -5 | while read f; do
            echo "Found: $f"
          done
          
          # Copy binaries (adjust paths as needed)
          cp target/x86_64-unknown-none/debug/egg_os iso_root/boot/kernel || true
          
          # Create limine.conf
          cat > iso_root/limine.conf << 'EOF'
timeout: 3

/EggOS
    protocol: limine
    kernel_path: boot():/boot/kernel
EOF
          
          # Copy UEFI bootloader if it exists
          if [ -f "limine/BOOTX64.EFI" ]; then
            cp limine/BOOTX64.EFI iso_root/EFI/BOOT/
            cp iso_root/limine.conf iso_root/EFI/BOOT/
            
            # Build UEFI ISO
            xorriso -as mkisofs -R -J \
              -e EFI/BOOT/BOOTX64.EFI \
              -no-emul-boot \
              iso_root -o egg_os.iso
          else
            echo "ERROR: BOOTX64.EFI not found in limine/"
            ls -la limine/
            exit 1
          fi
          
          # Install Limine
          ./limine/limine uefi-install egg_os.iso || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egg_os-iso
          path: egg_os.iso
          if-no-files-found: warn
