name: CI & Build ISO

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Install Rust nightly with required targets and rust-src
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-uefi, x86_64-unknown-none
          components: rust-src

      # 2. Cache Cargo registry and target directories for faster builds
      - name: Setup Swatinem Cargo Cache
        uses: Swatinem/rust-cache@v2

      # 3. Install system dependencies (xorriso, mtools, dosfstools)
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso mtools dosfstools

      # 4. Build Bootloader
      - name: Build Bootloader (UEFI)
        run: cargo build --release --package bootloader --target x86_64-unknown-uefi

      # 5. Build Host Kernel & Security Kernel (Unikernel Host)
      - name: Build Kernels (Bare-Metal)
        run: |
          cargo build --release --package host_kernel --target x86_64-unknown-none
          cargo build --release --package security_kernel --target x86_64-unknown-none

      # 6. Construct FAT32 EFI Partition Image
      - name: Create FAT Partition Image
        run: |
          # Create a 64MB FAT image file
          dd if=/dev/zero of=efiboot.img bs=1M count=64
          mkfs.vfat -F 32 efiboot.img

          # Create UEFI directory layout
          mmd -i efiboot.img ::/EFI
          mmd -i efiboot.img ::/EFI/BOOT

          # Copy UEFI bootloader payload
          mcopy -i efiboot.img target/x86_64-unknown-uefi/release/bootloader.efi ::/EFI/BOOT/BOOTX64.EFI

          # Copy Host and Security Kernels into root partition
          mcopy -i efiboot.img target/x86_64-unknown-none/release/host_kernel ::/host_kernel
          mcopy -i efiboot.img target/x86_64-unknown-none/release/security_kernel ::/security_kernel

      # 7. Generate Bootable Hybrid ISO Image
      - name: Generate UEFI ISO
        run: |
          mkdir -p iso_root
          cp efiboot.img iso_root/

          xorriso -as mkisofs \
            -e efiboot.img \
            -no-emul-boot \
            -isohybrid-gpt-basdat \
            -volid "EGG_OS" \
            -o egg_os.iso iso_root

      # 8. Upload Artifact
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: egg_os-iso
          path: egg_os.iso
          retention-days: 7
