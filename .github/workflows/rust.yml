name: CI & Build ISO

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xorriso mtools
        rustup toolchain install nightly --profile minimal --component rust-src
        rustup target add x86_64-unknown-none

    - name: Build Workspace Binaries
      run: cargo build --release --workspace

    - name: Package ISO Directory Structure
      run: |
        mkdir -p iso_root/boot
        # Copy compiled binaries (adjust paths to match your output directory)
        cp target/x86_64-unknown-none/release/bootloader iso_root/boot/
        cp target/x86_64-unknown-none/release/host_kernel iso_root/boot/
        cp target/x86_64-unknown-none/release/security_kernel iso_root/boot/

    - name: Generate Bootable ISO
      run: |
        xorriso -as mkisofs -b boot/bootloader \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          -o egg_os.iso iso_root

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: egg_os-iso
        path: egg_os.iso
        retention-days: 7
