name: EggOS CI & ISO Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Kernels and Package ISO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools

      - name: Setup Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Build Host Kernel
        run: cargo build --manifest-path host_kernel/Cargo.toml --target x86_64-unknown-none

      - name: Build Security Kernel
        run: cargo build --manifest-path security_kernel/Cargo.toml --target x86_64-unknown-none

      - name: Assemble ISO Image
        run: |
          mkdir -p iso_root/boot iso_root/limine
          cp target/x86_64-unknown-none/debug/host_kernel iso_root/boot/kernel.elf

          cat << 'EOF' > iso_root/boot/limine.conf
          timeout: 3

          /EggOS
              protocol: limine
              kernel_path: boot():/boot/kernel.elf
          EOF

          cp iso_root/limine.conf iso_root/boot/limine.conf
          cp iso_root/limine.conf iso_root/limine/limine.conf

          git clone https://github.com/limine-bootloader/limine.git --branch=v7.x-binary --depth=1
          make -C limine
          
          cp -v limine/limine-bios.sys limine/limine-bios-cd.bin limine/limine-uefi-cd.bin iso_root/
          cp -v limine/limine-bios.sys limine/limine-bios-cd.bin limine/limine-uefi-cd.bin iso_root/boot/

          xorriso -as mkisofs -b limine-bios-cd.bin \
                  -no-emul-boot -boot-load-size 4 -boot-info-table \
                  --efi-boot limine-uefi-cd.bin \
                  -efi-boot-part --efi-boot-image --protective-msdos-label \
                  iso_root -o egg_os.iso

          ./limine/limine bios-install egg_os.iso

      - name: Upload EggOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: egg_os-bootable-iso
          path: egg_os.iso
