name: EggOS CI

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y xorriso mtools

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-none

      - name: Build Kernels
        run: |
          cargo build --manifest-path host_kernel/Cargo.toml
          cargo build --manifest-path security_kernel/Cargo.toml

      - name: Prepare Limine
        run: |
          git clone https://github.com/limine-bootloader/limine.git --branch=v7.x-binary --depth=1
          make -C limine

      - name: Assemble ISO (UEFI)
        run: |
          mkdir -p iso_root/boot iso_root/EFI/BOOT
          
          # Copy kernel binaries
          cp target/x86_64-unknown-none/debug/host_kernel iso_root/boot/
          cp target/x86_64-unknown-none/debug/security_kernel iso_root/boot/
          
          # Create limine.conf
          cat > iso_root/limine.conf << 'EOF'
timeout: 3

/EggOS Hypervisor
    protocol: limine
    kernel_path: boot():/boot/host_kernel
    module_path: boot():/boot/security_kernel
    module_cmdline: security_kernel
EOF
          
          # Copy EFI bootloader
          cp limine/BOOTX64.EFI iso_root/EFI/BOOT/
          cp iso_root/limine.conf iso_root/EFI/BOOT/
          
          # Build ISO with UEFI boot
          xorriso -as mkisofs -R -J \
            -e EFI/BOOT/BOOTX64.EFI \
            -no-emul-boot \
            -isohybrid-mbr /usr/lib/ISOLINUX/isohdpfx.bin \
            iso_root -o egg_os.iso
          
          # Install Limine UEFI to ISO
          ./limine/limine uefi-install egg_os.iso

      - uses: actions/upload-artifact@v4
        with:
          name: egg_os-iso
          path: egg_os.iso
