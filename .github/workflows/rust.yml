- name: Package ISO with Limine
        run: |
          mkdir -p iso/boot
          
          # Copy both workspace kernel binaries
          cp target/x86_64-unknown-none/debug/host_kernel iso/boot/
          cp target/x86_64-unknown-none/debug/security_kernel iso/boot/
          cp limine/limine-bios.sys limine/limine-bios-cd.bin iso/boot/

          # Configure Limine with correct v7 syntax
          cat << 'EOF' > iso/boot/limine.conf
          timeout: 5

          /EggOS
              protocol: multiboot2
              kernel_path: boot():/boot/host_kernel
              module_path: boot():/boot/security_kernel
          EOF

          # Create ISO image
          xorriso -as mkisofs -b boot/limine-bios-cd.bin \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            iso -o egg_os.iso

          # Install Limine BIOS stage to the ISO
          ./limine/limine bios-install egg_os.iso
