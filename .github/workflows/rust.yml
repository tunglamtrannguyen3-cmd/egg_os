- name: Build Kernel
        run: cargo build --verbose

      - name: Package ISO with Limine
        run: |
          mkdir -p iso/boot
          cp target/x86_64-unknown-none/debug/egg_os iso/boot/
          cp limine/limine-bios.sys limine/limine-bios-cd.bin iso/boot/

          cat << 'EOF' > iso/boot/limine.conf
          timeout: 0
          /EggOS
              protocol: multiboot2
              path: boot:///boot/egg_os
          EOF

          xorriso -as mkisofs -b boot/limine-bios-cd.bin \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            iso -o egg_os.iso

          ./limine/limine bios-install egg_os.iso
