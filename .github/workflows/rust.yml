name: CI & Build ISO

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Rust nightly toolchain with required x86_64 target triples
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-uefi, x86_64-unknown-none
          components: rust-src

      # 3. Speed up workflow with build caching
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # 4. Install ISO build utilities
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso mtools dosfstools

      # 5. Fast verification check across the entire workspace
      - name: Workspace Check
        run: cargo check --workspace

      # 6. Build custom UEFI bootloader
      - name: Build Custom Bootloader (UEFI)
        run: cargo build --release --package bootloader --target x86_64-unknown-uefi

      # 7. Build Host Kernel and Virtual Kernel
      - name: Build Kernels (Bare-Metal)
        run: |
          cargo build --release --package host_kernel --target x86_64-unknown-none
          cargo build --release --package virtual_kernel --target x86_64-unknown-none

      # 8. Create FAT32 Partition Image and populate custom bootloader + kernel binaries
      - name: Create FAT Partition Image
        run: |
          set -e
          dd if=/dev/zero of=efiboot.img bs=1M count=64
          mkfs.vfat -F 32 efiboot.img

          # Create UEFI boot directory structure
          mmd -i efiboot.img ::/EFI
          mmd -i efiboot.img ::/EFI/BOOT

          # Install custom UEFI bootloader as default EFI payload
          mcopy -i efiboot.img target/x86_64-unknown-uefi/release/bootloader.efi ::/EFI/BOOT/BOOTX64.EFI

          # Copy Host Kernel and Virtual Kernel binaries for custom ELF loader to read
          mcopy -i efiboot.img target/x86_64-unknown-none/release/host_kernel ::/host_kernel
          mcopy -i efiboot.img target/x86_64-unknown-none/release/virtual_kernel ::/virtual_kernel

      # 9. Generate Hybrid UEFI ISO
      - name: Generate Bootable UEFI ISO
        run: |
          rm -rf iso_root
          mkdir -p iso_root
          cp efiboot.img iso_root/

          xorriso -as mkisofs \
            -e efiboot.img \
            -no-emul-boot \
            -isohybrid-gpt-basdat \
            -volid "EGG_OS" \
            -o egg_os.iso iso_root

      # 10. Upload ISO as CI Artifact
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: egg_os-iso
          path: egg_os.iso
          retention-days: 7