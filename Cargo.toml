[workspace]
members = [
    "bootloader",
    "common",
    "host_kernel",
    "security_kernel",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Eggchese"]

[workspace.dependencies]
bitflags = "2.4"
spin = "0.9"
x86_64 = { version = "0.14.12", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
volatile = "0.4"
log = "0.4"
uefi = "0.28"
uefi-services = "0.25"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1

[profile.dev]
panic = "abort"
