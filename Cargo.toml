[workspace]
members = [
    "bootloader",
    "common",
    "host_kernel",
    "virtual_kernel",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.4.3"
authors = ["Eggchese"]

[workspace.dependencies]
bitflags = "2.4"
spin = "0.12.3"
x86_64 = { version = "0.14.12", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
volatile = "0.6.1"
log = "0.4"
uefi = "0.39.0"
lazy_static = { version = "1.4", features = ["spin_no_std"] }

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1

[profile.dev]
panic = "abort"
